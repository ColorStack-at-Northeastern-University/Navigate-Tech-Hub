name: Biweekly newsletter draft reminder

on:
  schedule:
    # Roughly every 14 days (GitHub cron is UTC; adjust if you want a fixed weekday).
    - cron: '0 14 */14 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open draft reminder issue (skip if one is already open)
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'newsletter-reminder';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (openIssues.length > 0) {
              core.info(`Skipping: open reminder already exists (#${openIssues[0].number}).`);
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const body = [
              'Time to draft the **Navigate Tech Hub** biweekly update in Buttondown.',
              '',
              '## Checklist',
              '- [ ] Copy `docs/newsletter/drafts/biweekly-template.md` → `docs/newsletter/drafts/YYYY-MM-DD-issue.md` (local; folder is gitignored)',
              '- [ ] Write 2–4 sentence intro under the Hi line',
              '- [ ] Fill guides, external picks, and ColorStack opportunity drops (`frontend/data/opportunities.ts`)',
              '- [ ] Push draft: `node scripts/draft-buttondown-newsletter.mjs docs/newsletter/drafts/YYYY-MM-DD-issue.md`',
              '- [ ] Buttondown → **Emails** → preview / **Send test** → schedule or send',
              '',
              '## Links',
              '- Site: https://navigatetechhub.com',
              '- Buttondown emails: https://buttondown.com/emails',
              '- Public archive: https://buttondown.com/navigate-tech-hub',
              '',
              'Close this issue when the send is scheduled or published.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Draft biweekly newsletter — ${today}`,
              body,
              labels: [label],
            });

            core.info(`Created reminder issue #${issue.number}`);
